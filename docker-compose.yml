# 作品集站点 · 本地托管
#
# 用法：
#   docker compose up -d           # http://127.0.0.1:8901
#   docker compose logs -f         # 看访问日志
#   docker compose down            # 停止
#
# 说明：端口只绑定回环 127.0.0.1，默认不暴露到局域网。
services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-portfolio-site:1.1.0
    container_name: agent-portfolio-site
    ports:
      - "127.0.0.1:8901:80"
    restart: unless-stopped
